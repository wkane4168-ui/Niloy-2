<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>শারদীয় দুর্গাপূজা উৎসব</title>
  <style>
    /* Google Fonts Import */
    @import url('https://fonts.googleapis.com/css2?family=Mina:wght@400;700&family=Atma:wght@500;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Mina', sans-serif;
      background: linear-gradient(135deg, #1f005c, #5b0060, #870160, #ac255e, #ca485c, #e16b5c, #f39060, #ffb56b);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: #fff;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: rgba(0, 0, 0, 0.4);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.18);
    }

    h1 {
      font-family: 'Atma', cursive;
      font-size: 2.8rem;
      color: #ffd700;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
      margin-bottom: 10px;
    }

    /* অটোমেটিক পূজা উইশ ব্যানার */
    .puja-wish-banner {
      background: linear-gradient(45deg, #ff416c, #ff4b2b);
      padding: 15px 20px;
      border-radius: 12px;
      font-size: 1.8rem;
      font-weight: bold;
      color: #ffffff;
      margin: 20px 0;
      box-shadow: 0 4px 15px rgba(255, 75, 43, 0.4);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.02); }
      100% { transform: scale(1); }
    }

    /* কাউন্টডাউন / উৎসবের খবর */
    .status-box {
      background: rgba(255, 255, 255, 0.1);
      padding: 20px;
      border-radius: 15px;
      margin: 20px 0;
      font-size: 1.4rem;
      color: #ffe600;
    }

    .countdown {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 15px;
    }

    .time-card {
      background: rgba(0, 0, 0, 0.5);
      padding: 10px 15px;
      border-radius: 10px;
      min-width: 70px;
      border: 1px solid #ffd700;
    }

    .time-card span {
      display: block;
      font-size: 1.8rem;
      font-weight: bold;
      color: #fff;
    }

    .time-card p {
      font-size: 0.9rem;
      color: #ffd700;
    }

    /* রেসপনসিভ অ্যাডজাস্টমেন্ট */
    @media (max-width: 600px) {
      h1 { font-size: 2rem; }
      .puja-wish-banner { font-size: 1.4rem; }
      .status-box { font-size: 1.1rem; }
      .time-card { min-width: 55px; padding: 8px; }
      .time-card span { font-size: 1.3rem; }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🌸 শারদীয় দুর্গোৎসব 🌸</h1>
    
    <!-- ডাইনামিক পূজার শুভেচ্ছা দেখাবে -->
    <div id="wishBanner" class="puja-wish-banner">
      শুভ শারদীয় দুর্গোৎসব!
    </div>

    <!-- উৎসব শুরু নোটিশ / কাউন্টডাউন -->
    <div class="status-box" id="statusBox">
      <div id="statusMessage">উৎসবের কাউন্টডাউন চলছে...</div>
      <div class="countdown" id="countdownBox">
        <div class="time-card"><span id="days">00</span><p>দিন</p></div>
        <div class="time-card"><span id="hours">00</span><p>ঘণ্টা</p></div>
        <div class="time-card"><span id="minutes">00</span><p>মিটি</p></div>
        <div class="time-card"><span id="seconds">00</span><p>সেকেন্ড</p></div>
      </div>
    </div>
  </div>

  <script>
    // তারিখ অনুযায়ী অটোমেটিক শুভেচ্ছা আপডেট করার ফাংশন
    function updatePujaWish() {
      const today = new Date();
      const month = today.getMonth() + 1; // 10 = October
      const date = today.getDate();
      const wishBanner = document.getElementById('wishBanner');

      if (month === 10) {
        if (date === 17) {
          wishBanner.innerText = "🌸 শুভ ষষ্ঠী! 🌸";
        } else if (date === 18) {
          wishBanner.innerText = "🌺 শুভ সপ্তমী! 🌺";
        } else if (date === 19) {
          wishBanner.innerText = "🌼 শুভ মহাঅষ্টমী! 🌼";
        } else if (date === 20) {
          wishBanner.innerText = "🌻 শুভ মহানবমী! 🌻";
        } else if (date === 21) {
          wishBanner.innerText = "🔱 শুভ বিজয়া দশমী! 🔱";
        } else if (date > 21) {
          wishBanner.innerText = "✨ শুভ বিজয়ার প্রীতি ও শুভেচ্ছা! ✨";
        } else {
          wishBanner.innerText = "🎉 শুভ শারদীয় দুর্গোৎসবের আগাম শুভেচ্ছা! 🎉";
        }
      } else {
        wishBanner.innerText = "🌸 শুভ শারদীয় দুর্গোৎসব! 🌸";
      }
    }

    // কাউন্টডাউন এবং উৎসব শুরুর স্টেট ম্যানেজমেন্ট
    function updateCountdown() {
      // দুর্গাপূজা শুরু: ১৭ অক্টোবর ২০২৬, সকাল ৬:০০
      const pujaStartDate = new Date('October 17, 2026 06:00:00').getTime();
      const now = new Date().getTime();
      const difference = pujaStartDate - now;

      const statusMessage = document.getElementById('statusMessage');
      const countdownBox = document.getElementById('countdownBox');

      if (difference <= 0) {
        // পূজা শুরু হয়ে গেলে কাউন্টডাউন গায়েব হয়ে যাবে
        statusMessage.innerHTML = "🎉 উৎসব শুরু হয়ে গেছে! সবাইকে পূজার অনেক অনেক শুভেচ্ছা ও আনন্দ! 🎉";
        countdownBox.style.display = "none";
      } else {
        // পূজা শুরুর আগের সময় গণনা
        const d = Math.floor(difference / (1000 * 60 * 60 * 24));
        const h = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const m = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
        const s = Math.floor((difference % (1000 * 60)) / 1000);

        document.getElementById('days').innerText = d < 10 ? '0' + d : d;
        document.getElementById('hours').innerText = h < 10 ? '0' + h : h;
        document.getElementById('minutes').innerText = m < 10 ? '0' + m : m;
        document.getElementById('seconds').innerText = s < 10 ? '0' + s : s;
      }
    }

    // স্ক্রিপ্ট রান করানো
    updatePujaWish();
    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
  </html>
